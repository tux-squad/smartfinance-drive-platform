services:
  - type: web
    name: smartfinance-backend
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    envVars:
      - key: PORT
        value: 10000
      - key: DB_URL
        fromDatabase:
          name: smartfinance-db
          property: connectionString
      - key: DB_USERNAME
        fromDatabase:
          name: smartfinance-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: smartfinance-db
          property: password
      - key: DDL_AUTO
        value: validate
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRATION_MS
        value: 900000
      - key: JWT_REFRESH_EXPIRATION_MS
        value: 604800000
      - key: CORS_ALLOWED_ORIGINS
        value: "http://localhost:3000,http://localhost:4200,http://localhost:5173,http://localhost:8080"
      # Populate third-party service credentials in Render Dashboard Environment settings
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: STRIPE_API_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false

databases:
  - name: smartfinance-db
    databaseName: smartfinancedb
    user: postgres
    plan: free
    region: oregon
