version: '3.8'

services:
  # PostgreSQL Database Container
  db:
    image: postgres:16-alpine
    container_name: smartfinance-db
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-smartfinancedb}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres} -d ${POSTGRES_DB:-smartfinancedb}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - smartfinance-net

  # Backend Spring Boot Application Container
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: smartfinance-backend
    restart: on-failure
    ports:
      - "${PORT:-8080}:8080"
    environment:
      DB_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-smartfinancedb}
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DDL_AUTO: ${DDL_AUTO:-none}
      SHOW_SQL: ${SHOW_SQL:-false}
      JWT_SECRET: ${JWT_SECRET:-change-me-secret-key-for-local-development-min-256-bits!}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-900000}
      JWT_REFRESH_EXPIRATION_MS: ${JWT_REFRESH_EXPIRATION_MS:-604800000}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      CHEQUEA_API_KEY: ${CHEQUEA_API_KEY:-}
      CHEQUEA_BASE_URL: ${CHEQUEA_BASE_URL:-https://api.chequea.pe}
      STRIPE_API_KEY: ${STRIPE_API_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_SUCCESS_URL: ${STRIPE_SUCCESS_URL:-http://localhost:5173/billing/success?session_id={CHECKOUT_SESSION_ID}}
      STRIPE_CANCEL_URL: ${STRIPE_CANCEL_URL:-http://localhost:5173/billing/cancel}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:4200,http://localhost:5173,http://localhost:8080}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - smartfinance-net

volumes:
  postgres-data:
    driver: local

networks:
  smartfinance-net:
    driver: bridge
