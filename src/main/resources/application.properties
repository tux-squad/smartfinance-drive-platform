spring.application.name=smartfinance-drive-platform
server.port=${PORT:8080}

# Cloudinary Configuration
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}

# Multipart File Upload Limits (Max 10MB)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# CORS Configuration
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:4200,http://localhost:5173,http://localhost:8080}

# Security / JWT Authorization Configuration
authorization.jwt.secret=${JWT_SECRET}
authorization.jwt.expiration-ms=${JWT_EXPIRATION_MS:900000}
authorization.jwt.refresh-expiration-ms=${JWT_REFRESH_EXPIRATION_MS:604800000}

# Google OAuth2 Credentials
google.client-id=${GOOGLE_CLIENT_ID:}
google.client-secret=${GOOGLE_CLIENT_SECRET:}

# Database Configuration (PostgreSQL)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/smartfinancedb}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:validate}
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Chequea.pe SUNAT RUC Verification Configuration
chequea.api-key=${CHEQUEA_API_KEY:}
chequea.base-url=${CHEQUEA_BASE_URL:https://api.chequea.pe}

# Stripe Payment Gateway & Webhook Configuration
stripe.api-key=${STRIPE_API_KEY:}
stripe.webhook-secret=${STRIPE_WEBHOOK_SECRET:}
stripe.success-url=${STRIPE_SUCCESS_URL:http://localhost:5173/billing/success?session_id={CHECKOUT_SESSION_ID}}
stripe.cancel-url=${STRIPE_CANCEL_URL:http://localhost:5173/billing/cancel}

# Swagger UI / OpenAPI Documentation Toggle
swagger.enabled=${SWAGGER_ENABLED:true}

# Analytics Dashboard Configuration
analytics.fx.pen-to-usd=${ANALYTICS_FX_PEN_TO_USD:3.75}

# Factiliza RENIEC DNI Verification Configuration
factiliza.base-url=${FACTILIZA_BASE_URL:https://api.factiliza.com}
factiliza.api-key=${FACTILIZA_API_KEY:}

# Spring Mail / Corporate OTP Email Configuration
spring.mail.host=${SPRING_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${SPRING_MAIL_PORT:465}
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.ssl.enable=${SPRING_MAIL_SSL_ENABLE:true}
spring.mail.properties.mail.smtp.starttls.enable=${SPRING_MAIL_STARTTLS_ENABLE:false}
spring.mail.properties.mail.smtp.starttls.required=${SPRING_MAIL_STARTTLS_REQUIRED:false}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
app.mail.allow-emulated=${APP_MAIL_ALLOW_EMULATED:true}




# Firebase Phone Authentication Configuration
firebase.project-id=${FIREBASE_PROJECT_ID:}
firebase.credentials.base64=${FIREBASE_CREDENTIALS_BASE64:}
firebase.credentials.path=${FIREBASE_CREDENTIALS_PATH:}

# EmailVerify.io Real-time Email Verification Configuration
emailverify.api-key=${EMAILVERIFY_API_KEY:}
emailverify.base-url=${EMAILVERIFY_BASE_URL:https://app.emailverify.io}

